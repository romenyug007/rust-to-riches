<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rust to Riches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E7E1D3;--fg:#1E1F22;--card:#FBF8F1;--mut:#5E5A52;--acc:#E0662F;--line:#CFC6B4;--bad:#B3261E;--ok:#2E7D46;color-scheme:light}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 Rubik,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font:400 26px 'Russo One',sans-serif;margin:8px 0;color:var(--acc)}h1 span{font:13px Rubik,sans-serif;color:var(--mut)}
body.ingame main>h1{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
button{font:inherit;font-weight:600;background:var(--acc);color:#1E1F22;border:0;border-radius:9px;padding:8px 12px;margin:3px 4px 3px 0;cursor:pointer}
button.sec{background:#DDD5C4;color:var(--fg)}button:disabled{opacity:.5}
input,select{font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg);max-width:100%}
.tok{display:inline-block;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;text-align:center;line-height:22px;margin-right:3px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.mut{color:var(--mut)}.bad{color:var(--bad)}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;margin:1px 2px 1px 0}
.d-vedro{background:#ECE8DF;color:#111;border:1px solid #8A867D}.d-bitye{background:#F08A24;color:#111}.d-family{background:#2E7D46;color:#fff}.d-premium{background:#1F5FAE;color:#fff}.d-retro{background:#B3261E;color:#fff}
#dice{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.38);z-index:70}
.d3box{display:flex;flex-direction:column;align-items:center;gap:12px;color:#fff;font:600 22px Rubik,sans-serif;text-align:center}
.d3area{width:min(92vw,760px);height:min(62vh,440px);position:relative;border-radius:26px;background:#23412F;border:8px solid #3A2A1C;overflow:hidden;touch-action:none;perspective:900px;box-shadow:inset 0 0 60px rgba(0,0,0,.45)}
.d3pos{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;transform-style:preserve-3d;cursor:grab;touch-action:none}
.cube{width:110px;height:110px;position:relative;transform-style:preserve-3d;transform:rotateX(-18deg) rotateY(24deg)}
.cube .f{position:absolute;inset:0;background:#F5F0E6;border:2px solid #CFC6B4;border-radius:18px;box-sizing:border-box;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:15px;gap:6px;backface-visibility:hidden;box-shadow:inset 0 0 14px rgba(0,0,0,.18)}
.cube .f i{border-radius:50%;background:#1E1F22}.cube .f i.o{visibility:hidden}
.cube .f1{transform:translateZ(55px)}.cube .f6{transform:rotateY(180deg) translateZ(55px)}.cube .f2{transform:rotateY(90deg) translateZ(55px)}.cube .f5{transform:rotateY(-90deg) translateZ(55px)}.cube .f3{transform:rotateX(90deg) translateZ(55px)}.cube .f4{transform:rotateX(-90deg) translateZ(55px)}
.d3shadow{position:absolute;left:50%;top:50%;width:120px;height:40px;margin:50px 0 0 -60px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(6px)}
.lcard{width:470px;height:260px;border-radius:16px;overflow:hidden;border:4px solid var(--lc);background:var(--card);display:flex;flex-direction:column;box-shadow:0 12px 30px rgba(0,0,0,.3);animation:fly .8s cubic-bezier(.2,.8,.2,1)}
.lcard .lb{background:var(--lc);color:#fff;font:400 20px 'Russo One',sans-serif;padding:10px 16px;letter-spacing:.06em}
.lcard .lt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
.lcard .lt b{font:400 28px 'Russo One',sans-serif}
.act button.mv{font-size:19px;padding:12px 16px}
.cell .toks{z-index:2}.cell .toks svg+svg{margin-left:-40px}
.die{width:120px;height:120px;border-radius:24px;background:#F5F0E6;color:#1E1F22;font:400 64px/120px 'Russo One',sans-serif;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.roll{animation:roll .9s ease-out}@keyframes roll{0%{transform:translateX(-260px) rotate(-720deg)}100%{transform:none}}
/* ---- игровой экран: фиксированная сцена 1600×900, масштабируется под экран ---- */
.vp{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center}
.hdr{position:absolute;left:24px;right:24px;top:10px;height:56px;display:flex;align-items:center;justify-content:space-between}
.ttl{font:400 34px/1 'Russo One',sans-serif;color:var(--acc);letter-spacing:.03em}.sub{font-size:14px;color:var(--mut);letter-spacing:.05em}
.pill{height:44px;padding:0 14px;border-radius:12px;background:#2C2D33;color:#fff;display:inline-flex;align-items:center;gap:8px;margin-left:8px}
.pill small{font-size:11px;color:#B9B5AC;letter-spacing:.1em}.pill b{font:400 20px 'Russo One',sans-serif}
.board{position:absolute;left:20px;top:74px;width:1560px;height:744px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr);gap:7px}
.cell{position:relative;margin:0;padding:0;font:inherit;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;color:var(--fg);min-width:0;min-height:0}
.cell .band{height:30px;flex:none;display:flex;align-items:center;justify-content:center;font:400 15px 'Russo One',sans-serif;letter-spacing:.05em}
.cell .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px}
.cell .short{font-size:12px;color:var(--mut);line-height:1.2}
.cell.dark{background:#26272C;border-color:var(--acc)}.cell.dark .short{color:#D6D1C7}
.cell.deck{box-shadow:3px 3px 0 0 #E7E1D3,5px 5px 0 0 var(--dc),7px 7px 0 0 #E7E1D3,9px 9px 0 0 var(--dc)}
.cell.here{outline:4px solid var(--acc);outline-offset:-2px}
.cell.reach{border-color:#2E7D46;border-width:3px}
.cell .reach-b{position:absolute;right:6px;top:34px;background:#2E7D46;color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:8px}
.cell .toks{position:absolute;left:2px;bottom:0;display:flex}
.center{grid-row:2/4;grid-column:2/6;position:relative;background:#D9D1C1;border:2px solid #C6BBA6;border-radius:16px;display:flex;gap:12px;padding:10px;min-height:0}
.act{width:430px;flex:none;background:var(--card);border-radius:12px;padding:10px 12px;overflow:auto;font-size:14px}
.act p{margin:6px 0}.act label{font-size:13px}
.act .turn{font-weight:600;margin-bottom:4px}
.act .log{margin-top:8px;border-top:1px solid var(--line);padding-top:6px;font-size:12px;color:var(--mut)}
.gar{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;gap:8px}
.gar .gh{display:flex;gap:16px;align-items:baseline;font-size:14px;color:#3A3B40}
.gar .gh b{font:400 19px 'Russo One',sans-serif;color:#1E1F22}
.cols{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,88px);grid-auto-columns:188px;gap:10px 16px;overflow-x:auto;overflow-y:hidden;align-content:start;padding-bottom:4px}
.pair{display:flex;gap:4px;cursor:pointer}
.cc{width:112px;height:88px;flex:none;position:relative;background:var(--card);border:2px solid var(--dc);border-radius:9px;overflow:hidden;display:flex;flex-direction:column;box-sizing:border-box}
.cc .b{height:17px;flex:none;background:var(--dc);color:var(--df);font:400 10px/17px 'Russo One',sans-serif;letter-spacing:.05em;text-align:center}
.cc .im{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.cc .pr{font-size:11px;font-weight:700;text-align:center;padding-bottom:3px;white-space:nowrap}
.cc .tint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(204,40,40,.32) 0,rgba(204,40,40,.32) 34%,rgba(204,40,40,0) 34%)}
.dc{width:70px;height:88px;flex:none;border:2px solid #8E2A24;background:#F7E6E3;border-radius:9px;overflow:hidden;display:flex;flex-direction:column;box-sizing:border-box;font-size:10px;text-align:center}
.dc .b{height:17px;flex:none;background:#8E2A24;color:#fff;font-weight:700;letter-spacing:.06em;line-height:17px}
.dc .t{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;line-height:1.2}
.dc.empty{border:2px dashed #B9AE98;background:transparent}
.ov{position:absolute;inset:0;z-index:5;background:rgba(217,209,193,.97);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.big{width:560px;height:260px;display:flex;border-radius:16px;overflow:hidden;border:3px solid var(--dc);background:var(--card);box-shadow:0 12px 30px rgba(0,0,0,.3)}
.big .sc{width:60%;position:relative;display:flex;align-items:center;justify-content:center}
.big .nm{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:rgba(23,24,27,.84);color:#fff;display:flex;justify-content:space-between;align-items:center;font:400 19px 'Russo One',sans-serif}
.big .inf{width:40%;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.big .row2{display:flex;justify-content:space-between;align-items:baseline}.big .row2 b{font:400 17px 'Russo One',sans-serif}
.bigdef{width:200px;height:260px;border:3px solid #8E2A24;background:#F7E6E3;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.3);animation:fly .8s cubic-bezier(.2,.8,.2,1)}
.bigdef .b{background:#8E2A24;color:#fff;font:400 17px 'Russo One',sans-serif;padding:9px 12px}
.bigdef .t{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center}
@keyframes fly{0%{transform:translateX(900px) rotate(18deg)}100%{transform:none}}
#info{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;width:640px;background:var(--card);border:4px solid var(--acc);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.35);display:none;pointer-events:none;overflow:hidden}
#info .ih{padding:12px 20px;font:400 28px 'Russo One',sans-serif}#info .ib{padding:14px 20px 18px;font-size:18px;line-height:1.5;white-space:pre-line}
.pls{position:absolute;left:20px;right:20px;bottom:10px;height:62px;display:flex;gap:10px}
.pl{position:relative;flex:1;border-radius:12px;border:2px solid #C6BBA6;background:var(--card);display:flex;align-items:center;gap:10px;padding:0 14px;outline:none}
.pl.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}.pl.out{opacity:.45}
.pl .n{flex:1;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl .m{font:400 19px 'Russo One',sans-serif}
.pl .pop{display:none;position:absolute;left:0;bottom:70px;width:360px;max-height:360px;overflow:auto;background:#2C2D33;color:#fff;border-radius:12px;padding:12px 14px;z-index:30;box-shadow:0 14px 36px rgba(0,0,0,.5);font-size:13px}
.pl:hover .pop,.pl:focus .pop,.pl:focus-within .pop{display:block}
.pl .pop .r{display:flex;gap:8px;align-items:center;margin:4px 0}
.mback{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:39}
.modal{position:absolute;left:160px;top:90px;width:1280px;height:720px;box-sizing:border-box;z-index:40;background:#FBF8F1;border:4px solid var(--acc);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.45);padding:22px 30px;overflow:auto;font-size:26px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;font:400 30px 'Russo One',sans-serif;margin-bottom:10px}
.modal button{font-size:26px;padding:16px 26px;border-radius:12px;margin:6px 10px 6px 0}
.modal input,.modal select{font-size:25px;padding:10px}
.modal label{font-size:25px;display:block;padding:7px 0}
.modal input[type=checkbox],.modal input[type=radio]{width:28px;height:28px;vertical-align:middle;margin-right:8px}
.modal .big{margin:6px auto 14px}
.reopen{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);z-index:38;font-size:24px;padding:16px 30px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.rot{display:none;position:fixed;inset:auto 0 0 0;padding:8px;text-align:center;background:#2C2D33;color:#fff;z-index:60;font-size:14px}
@media (orientation:portrait){.ingame .rot{display:block}}
</style></head><body><main>
<h1>Rust to Riches <span>— от ржавого ведра до миллионера</span></h1>
<div id="app"></div><div id="dice"></div><div class="rot">Поверните телефон горизонтально — так поле видно целиком</div>
</main>
<script>
/*ENGINE*/

const $=(s)=>document.querySelector(s);
const PAWN={red:['#D32F2F','#fff','Красный'],blue:['#1F5FAE','#fff','Синий'],green:['#2E7D46','#fff','Зелёный'],yellow:['#F2C14E','#141516','Жёлтый'],black:['#141516','#fff','Чёрный'],white:['#FFFFFF','#141516','Белый']};
const PORDER=['red','blue','green','yellow','black','white'];
const pcol=(i)=>(LOBBY&&LOBBY.colors&&LOBBY.colors[i])||PORDER[i%6];
// человечек с широким контуром (~20% от фигуры): чёрный — с белым, белый — с чёрным
function goalPick(){const gs=(LOBBY.goals||[]).filter(Boolean),mine=(LOBBY.goals||[])[ME];const fin=gs.length?Math.min(...gs):30000;
 return '<p><b>До какой суммы играем?</b> Каждый выбирает, игра идёт до самой маленькой.<br>'+GOALS.map(g=>`<button class="sec" data-goal="${g}" style="${mine===g?'outline:3px solid var(--acc)':''}">${eur(g)}</button>`).join('')+'</p><p>Выбрали: '+LOBBY.players.map((n,i)=>n+' — '+((LOBBY.goals||[])[i]?eur(LOBBY.goals[i]):'не выбрал')).join(', ')+'<br><b>Игра будет до '+eur(fin)+'</b></p>'}
function picker(){return '<p><b>Выберите человечка:</b><br>'+PORDER.map(c=>{const taken=LOBBY.colors&&LOBBY.colors.some((x,j)=>j!==ME&&x===c);const mine=pcol(ME)===c;return `<button class="sec" data-pc="${c}" ${taken?'disabled':''} style="padding:6px 8px;${mine?'outline:3px solid var(--acc)':''}" title="${PAWN[c][2]}">${pawnC(c,40)}</button>`}).join('')+'</p>'}
function pawn(i,h){return pawnC(pcol(i),h)}
function pawnC(col,h){const c=PAWN[col]||PAWN.red,w=Math.round(h*0.62);return `<svg width="${w}" height="${h}" viewBox="0 0 30 48" aria-label="${c[2]} человечек" style="filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))"><g fill="${c[0]}" stroke="${c[1]}" stroke-width="4.5" stroke-linejoin="round"><circle cx="15" cy="10" r="7.5"/><path d="M4 45 L6.5 26 Q8 19.5 15 19.5 Q22 19.5 23.5 26 L26 45 Z"/></g></svg>`}
const CN={dealer:'Дилер',vedro:'Economy',avtoservis:'Автосервис',gonka_reroll:'Гонка',avtopodbor:'Авторынок',lottery:'Лотерея',bitye:'Crash',tehosmotr:'Техосмотр',perekup:'Перекуп',family:'Family',premium:'Luxury',ugon:'Угон',prokat:'Прокат',retro:'Classic',bank:'Банк'};
const CD={dealer:'продать все машины',vedro:'покупка',avtoservis:'ремонт',gonka_reroll:'переброс у организатора',avtopodbor:'любая колода',lottery:'карта удачи',bitye:'ремонт по кубику',tehosmotr:'100 € за машину',perekup:'продать 1 машину',family:'+10% за проход',premium:'покупка',ugon:'кубик 5–6',prokat:'только целые',retro:'только аукцион',bank:'+5% к наличным'};
const DN={vedro:'Economy',bitye:'Crash',family:'Family',premium:'Luxury',retro:'Classic'};
const GRID=[[4,1],[3,1],[2,1],[1,1],[1,2],[1,3],[1,4],[1,5],[1,6],[2,6],[3,6],[4,6],[4,5],[4,4],[4,3],[4,2]];
const LOT={win:'Выигрыш в лотерею',buyer:'Нашёл покупателя',insurance:'Страховка',swap:'Обмен',dps:'Пост ДПС',evac:'Эвакуатор',tire:'Пробил колесо',birthday:'День рождения',recall:'Отзывная кампания',lux_tax:'Налог на роскошь',expo:'Выставка ретро'};
const eur=(n)=>Number(n).toLocaleString('ru-RU')+' €';
let sw={t:-1},ME=-1,ROOM='',TOKEN='',CAT=null,LOBBY=null,es=null,lastGains=[],G=null,logs=[],deadline=0,curKey='',paused=null,toast='',rt=-1,rs=100;
function tkey(){const s=G;return s.phase==='move'?'m'+s.turn:s.phase==='auction'?'a'+s.auction.bid+'/'+s.auction.bidder:s.phase==='race_join'?'r'+s.turn:s.phase==='loan'?'l':s.phase==='swap_offer'?'o'+s.turn:'t'+s.turn}
function secs(k){return k[0]==='g'?RACE_ROLL_SECONDS:k[0]==='m'?MOVE_SECONDS:k[0]==='a'?AUCTION_SECONDS:k[0]==='r'?RACE_JOIN_SECONDS:k[0]==='l'||k[0]==='o'?LOAN_SECONDS:ACT_SECONDS}
const TL={g:'Бросок кубика: ',m:'Выбор шагов: ',t:'Решение: ',a:'Аукцион: ',r:'Окно гонки: ',l:'Займ: ',o:'Ответ на обмен: '};

function nm(i){return G.players[i].name}
function cn(id){return G.catalog[id].name}
function fmt(e){const n=nm;switch(e.type){
case 'game_start':return 'Игра началась, первым ходит '+n(e.first);
case 'moved':return n(e.player)+' идёт на '+e.steps+(e.cost?' (−'+eur(e.cost)+')':'')+' → '+CN[e.cell];
case 'revealed':return 'Открыта карта: '+cn(e.cardId);
case 'bought':return n(e.player)+' купил «'+cn(e.cardId)+'» за '+eur(e.price);
case 'car_gained':{const k=G.catalog[e.cardId];return n(e.player)+' получает '+chip(e.cardId)+' · продажа '+eur(k.sell)+' · '+rep(k,e.defect,e.defectCost)}
case 'swap':return n(e.player)+': обмен «'+cn(e.from)+'» на две машины Economy';
case 'auction_started':return n(e.player)+' объявил аукцион, ставка '+eur(e.bid);
case 'bid':return n(e.player)+' ставит '+eur(e.amount);
case 'auction_pass':return n(e.player)+' пас';
case 'auction_won':return n(e.player)+' выигрывает «'+cn(e.cardId)+'» за '+eur(e.price);
case 'discarded':return 'Карта «'+cn(e.cardId)+'» ушла вниз колоды';
case 'repair_roll':return e.die?'Куб для Crash: '+e.die:'Автосервис';
case 'repaired':return n(e.player)+' починил '+e.carIds.length+' шт. за '+eur(e.total);
case 'sold':return n(e.player)+' продал машины на '+eur(e.total);
case 'rent':return n(e.player)+' получает за прокат '+eur(e.total);
case 'taxi':return n(e.player)+' в такси: куб '+e.die+' → +'+eur(e.income);
case 'race_started':return n(e.organizer)+' организует гонку, фонд '+eur(e.pot);
case 'race_challenge':return n(e.organizer)+' вызывает '+n(e.target)+', взнос '+eur(e.stake);
case 'race_join':return n(e.player)+' вступает в гонку';
case 'race_roll':return n(e.player)+' бросает: '+e.die+(e.tie?' (перебросок)':'');
case 'race_tie':return 'Одинаковые числа — перебрасывают: '+e.players.map(n).join(', ');
case 'loan_warning':return '⚠ '+n(e.borrower)+' должен '+n(e.lender)+' '+eur(e.due)+': на следующем круге заберут машину';
case 'loan_seized':return n(e.borrower)+' отдаёт '+n(e.lender)+' машину «'+cn(e.cardId)+'» (оценка '+eur(e.value)+') в счёт долга '+eur(e.due);
case 'race_rolls':return 'Кубы: '+Object.entries(e.rolls).map(([k,v])=>n(+k)+' '+v).join(', ');
case 'race_plus1':return n(e.player)+' получает +1';
case 'race_reroll':return n(e.player)+' перебрасывает: '+e.die+' (было '+e.first+')';
case 'race_won':return n(e.player)+' выигрывает гонку: '+eur(e.pot);
case 'loan_request':return n(e.borrower)+' просит в долг '+eur(e.amount);
case 'loan_given':return n(e.lender)+' даёт '+n(e.borrower)+' '+eur(e.amount);
case 'loan_cancelled':return 'Запрос займа отменён';

gonka_reroll:()=>`<svg width="220" height="104" viewBox="0 0 220 104" aria-hidden="true"><rect x="0" y="40" width="220" height="56" fill="#3A3B40"/><path d="M0 68 H220" stroke="#F5F0E6" stroke-width="2.5" stroke-dasharray="14 10"/><g fill="#F5F0E6"><rect x="186" y="40" width="7" height="7"/><rect x="193" y="47" width="7" height="7"/><rect x="186" y="54" width="7" height="7"/><rect x="193" y="61" width="7" height="7"/><rect x="186" y="68" width="7" height="7"/><rect x="193" y="75" width="7" height="7"/><rect x="186" y="82" width="7" height="7"/><rect x="193" y="89" width="7" height="7"/></g><g fill="#B9B5AC"><circle cx="18" cy="58" r="9" opacity=".35"/><circle cx="36" cy="54" r="11" opacity=".45"/><circle cx="56" cy="57" r="8" opacity=".6"/><circle cx="26" cy="82" r="10" opacity=".35"/><circle cx="46" cy="79" r="12" opacity=".45"/><circle cx="68" cy="83" r="8" opacity=".6"/></g>${mini('premium',66,28,.82,'#D32F2F')}${mini('premium',86,56,.82,'#1F5FAE')}</svg>`,
perekup:()=>`<svg width="220" height="104" viewBox="0 0 220 104" aria-hidden="true"><rect x="4" y="8" width="212" height="92" rx="8" fill="#3A3B40"/><path d="M12 54 H208" stroke="#E2B84A" stroke-width="2"/><path d="M76 12 V50 M146 12 V50 M110 58 V96" stroke="#E2B84A" stroke-width="2"/>${mini('vedro',8,18,.52)}${mini('bitye',80,18,.52)}${mini('retro',150,18,.52)}${mini('premium',40,60,.55)}${mini('vedro',118,60,.55,'#5E8C61')}<g font-family="Rubik,sans-serif" font-size="11" font-weight="700"><rect x="24" y="12" width="22" height="13" rx="3" fill="#F2C14E"/><text x="29" y="22" fill="#1E1F22">€</text><rect x="96" y="12" width="22" height="13" rx="3" fill="#F2C14E"/><text x="101" y="22" fill="#1E1F22">€</text><rect x="166" y="12" width="22" height="13" rx="3" fill="#F2C14E"/><text x="171" y="22" fill="#1E1F22">€</text><rect x="58" y="56" width="22" height="13" rx="3" fill="#F2C14E"/><text x="63" y="66" fill="#1E1F22">€</text><rect x="136" y="56" width="22" height="13" rx="3" fill="#F2C14E"/><text x="141" y="66" fill="#1E1F22">€</text></g></svg>`,
dealer:()=>`<svg width="220" height="104" viewBox="0 0 220 104" aria-hidden="true"><rect x="10" y="10" width="200" height="16" rx="4" fill="#E0662F"/><rect x="14" y="26" width="192" height="72" fill="#E9EEF2"/><rect x="22" y="32" width="176" height="60" rx="3" fill="#9FC4D9"/><path d="M40 32 L20 92 M90 32 L70 92 M150 32 L130 92" stroke="#fff" stroke-width="6" opacity=".35"/><path d="M80 32 V92 M140 32 V92" stroke="#E9EEF2" stroke-width="3"/>${mini('premium',58,48,.85,'#B3261E')}<rect x="14" y="92" width="192" height="6" fill="#C6BBA6"/><path d="M4 98 V40 M216 98 V40" stroke="#B9B5AC" stroke-width="2"/><path d="M4 40 L16 44 L4 48 Z" fill="#1F5FAE"/><path d="M216 40 L204 44 L216 48 Z" fill="#2E7D46"/></svg>`};
let infoK=null,gainAt=0,modalOff='',holdUntil=0,lastCards=[];
const holding=()=>Date.now()<holdUntil;
function scale(){const st=$('#stage');if(!st)return;const k=Math.min(innerWidth/1600,innerHeight/900);st.style.transform=`translate(-50%,-50%) scale(${k})`}
addEventListener('resize',scale);
function showInfo(i){const el=$('#info');if(!el)return;if(i==null){el.style.display='none';return}const k=BOARD[i],c=DC[k]||SPECIAL[k]||['#26272C','#fff'];
 el.style.borderColor=DARK[k]?'#E0662F':(DC[k]?DC[k][2]:c[0]);el.innerHTML=`<div class="ih" style="background:${DARK[k]?'#E0662F':c[0]};color:${DARK[k]?'#1E1F22':c[1]}">${CN[k]}</div><div class="ib">${CDL[k]}</div>`;el.style.display='block'}
function cellHTML(i,s,reach){const k=BOARD[i],g=GRID[i],me=s.players[ME];let band,bandFg,cls='cell',body='';
 if(DC[k]){band=DC[k][0];bandFg=DC[k][1];cls+=' deck';body=W2(118,55,'0 0 120 56',CARS[k]||'')}
 else if(DARK[k]){band='#E0662F';bandFg='#1E1F22';cls+=' dark';body=ILL[k]?ILL[k]():icon(k,'#E0662F',46)}
 else{const c=SPECIAL[k]||['#3A3B40','#fff'];band=c[0];bandFg=c[1];body=icon(k,k==='lottery'?'#7A4FB5':k==='bank'?'#7A5C14':'#3A3B40',46)}
 if(k==='family')body=W2(130,52,'0 0 160 64',famInner(5));if(k==='lottery')cls+=' deck';
 if(s.players[s.current].pos===i)cls+=' here';const r=reach[i];if(r)cls+=' reach';
 const toks=s.players.filter(q=>q.pos===i&&!q.eliminated).map(q=>pawn(q.id,124)).join('');
 return `<button type="button" class="${cls}" data-cell="${i}" style="grid-row:${g[0]};grid-column:${g[1]};--dc:${DC[k]?DC[k][2]:'#7A4FB5'}"><span class="band" style="background:${band};color:${bandFg}">${CN[k].toUpperCase()}</span><span class="body">${body}<span class="short">${CD[k]}</span></span>${r?`<span class="reach-b">${r.steps} ${r.steps==1?'шаг':'шага'}${r.cost?' · '+eur(r.cost):''}</span>`:''}<span class="toks">${toks}</span></button>`}
function pairHTML(c){const k=G.catalog[c.id],d=DC[k.deck],di=defInfo(c);
 return `<div class="pair" title="${k.name}"><div class="cc" style="--dc:${d[2]};--df:${d[1]}"><div class="b" style="background:${d[0]}">${DN[k.deck].toUpperCase()}</div><div class="im">${carSVG(c.id,96)}</div><div class="pr">${k.name} · ${eur(shownPrice(c))}${c.fam?' <span style="color:#2E7D46">+'+c.fam*10+'%</span>':''}</div>${di?'<div class="tint"></div>':''}</div>`+
 (di?`<div class="dc"><div class="b">${c.hidden?'СКРЫТЫЙ':k.deck==='bitye'?'КРАШ':k.deck==='retro'?'РЕСТАВР.':'ДЕФЕКТ'}</div><div class="t"><b>${di[0]}</b>${di[1]}</div></div>`:'<div class="dc empty"></div>')+'</div>'}
function bigCard(id,title){const k=G.catalog[id],d=DC[k.deck],scn={vedro:'#C9D6DF',bitye:'#D8D2C8',family:'#C7DCCB',premium:'#C6D0E2',retro:'#E2D3C4'}[k.deck];
 const repTxt=k.deck==='family'?'Без дефекта · +10% за проход клетки Family, до +30%':k.deck==='bitye'?'Восстановление по кубику: '+[k.repair.die_1_2,k.repair.die_3_4,k.repair.die_5_6].map(eur).join(' / '):k.deck==='retro'?'Реставрация '+eur(k.repair.cost):'После покупки — дефект из колоды '+DN[k.deck];
 return `<div class="big" style="--dc:${d[2]}"><div class="sc" style="background:${scn}"><div style="margin-bottom:34px">${carSVG(id,280)}</div><div class="nm"><span>${k.name}</span><span class="chip" style="background:${d[0]};color:${d[1]}">${DN[k.deck].toUpperCase()}</span></div></div><div class="inf"><div class="mut" style="font-size:11px;letter-spacing:.1em">${title||''}</div>${k.buy!=null?`<div class="row2"><span>Покупка</span><b>${eur(k.buy)}</b></div>`:'<div class="row2"><span>Покупка</span><b>аукцион</b></div>'}<div class="row2"><span>Продажа</span><b style="color:#2E7D46">${eur(k.sell)}</b></div><div class="row2"><span>Старт аукциона</span><b style="color:#1F5FAE">${eur(k.auction_start)}</b></div><div style="height:2px;background:#DDD6C8;margin:2px 0"></div><div>${repTxt}</div></div></div>`}
function overlay(s){
 if(s.phase==='buy'&&s.pending)return `<div class="ov">${bigCard(s.pending.cardId,'ОТКРЫТАЯ КАРТА')}<div class="mut">${CN[BOARD[s.players[s.current].pos]]}: решение — в панели слева</div></div>`;
 if(s.phase==='auction'&&s.auction)return `<div class="ov">${bigCard(s.auction.cardId,'АУКЦИОН')}<div style="font:400 24px 'Russo One'">Ставка: ${eur(s.auction.bid)} · ${nm(s.auction.bidder)}</div></div>`;
 if(holding()&&lastCards.length){const e=lastCards[lastCards.length-1];
  if(e.type==='lottery')return `<div class="ov"><div class="lcard" style="--lc:#7A4FB5"><div class="lb">ЛОТЕРЕЯ · ${nm(e.player).toUpperCase()}</div><div class="lt"><b>${LOT[e.card]}</b><div style="font-size:17px">${fmt(e)}</div></div></div></div>`;
  const t=e.card==='repair_bonus'?'−10% на ремонт':e.card==='sale_bonus'?'+10% к продаже':'Скрытый дефект · '+DN[e.deck];
  return `<div class="ov"><div class="lcard" style="--lc:#3A3B40"><div class="lb">ТЕХОСМОТР · ${nm(e.player).toUpperCase()}</div><div class="lt"><b>${t}</b><div style="font-size:17px">${fmt(e)}</div></div></div></div>`}
 if(lastGains.length&&holding()&&Date.now()-gainAt<15000){const g=lastGains[lastGains.length-1],k=G.catalog[g.cardId];
  const def=g.defect?`<div class="bigdef"><div class="b">ДЕФЕКТ</div><div class="t"><b style="font-size:17px">${g.defect}</b>${g.defectCost?'Ремонт '+eur(g.defectCost):(g.defectText||'')}</div></div>`:k.deck==='bitye'?`<div class="bigdef"><div class="b">ВОССТАНОВЛЕНИЕ</div><div class="t">Цену решит кубик в Автосервисе:<br><b>${[k.repair.die_1_2,k.repair.die_3_4,k.repair.die_5_6].map(eur).join(' / ')}</b></div></div>`:'';
  return `<div class="ov"><div style="display:flex;gap:16px;align-items:center">${bigCard(g.cardId,'ПОЛУЧЕНО: '+nm(g.player).toUpperCase())}${def}</div></div>`}
 return ''}
function render(){
if(!G)return lobby();
document.body.classList.add('ingame');
const s=G,me=s.players[ME]||s.players[0],cur=s.players[actor(s)]||s.players[s.current];
const reach={};

let cells='';for(let i=0;i<BOARD.length;i++)cells+=cellHTML(i,s,reach);
// гараж: сначала столбики машин с дефектами, потом целые
const broken=me.cars.filter(c=>!c.repaired),okc=me.cars.filter(c=>c.repaired);
let gar=broken.map(pairHTML).join('');for(let i=broken.length%3?3-broken.length%3:0;i>0;i--)gar+='<div></div>';gar+=okc.map(pairHTML).join('');
const minAll=me.cars.reduce((t,c)=>t+(sellPrice(s,c,me)||0),0);
let top,modalHTML='';
if(s.phase==='over'){recordGame(s);const pl=s.places||[];const mine=s.players[ME]&&s.players[ME].finished;
 modalHTML=`<div class="mback"></div><div class="modal" style="text-align:center"><div class="mh" style="justify-content:center">Игра окончена</div>${pl.map((id,i)=>`<div style="font-size:34px;margin:10px 0">${MEDAL[i+1]} ${i+1}-е место — ${pawn(id,44)} <b>${nm(id)}</b> · ${eur(s.players[id].cash)}</div>`).join('')}${s.players.filter(q=>!q.finished).map(q=>`<div class="mut" style="font-size:22px">${q.name} — без медали</div>`).join('')}<p style="font-size:24px">${mine?'Ваш результат: '+MEDAL[mine]+' '+mine+'-е место':'В этот раз без медали'}</p><button id="again">В меню</button> <button class="sec" id="hist2">Моя история</button></div>`;
 top='<h2>Игра окончена</h2>'}
else{const li=loanInfo(s,ME);let loan='';
 if(s.phase==='loan'){const R=s.loanReq;loan='<p><b>'+nm(R.borrower)+'</b> просит в долг '+eur(R.amount)+'. 15 с на ответ.</p>'+(ME===R.borrower?'<button class="sec" data-a=\'{"type":"loan_cancel"}\'>Отмена</button>':(li.canAccept?'<button data-a=\'{"type":"loan_accept"}\'>Дать в долг '+eur(R.amount)+'</button>':'<span class="mut">У вас недостаточно денег</span>'))}
 else{if(li.canRequest)loan+=`<p class="mut">Не хватает денег? <input id="la" type="number" value="500" step="100" style="width:90px"><button class="sec" data-loan="1">Попросить в долг</button></p>`;
  li.repayable.forEach(r=>{if(r.roundsLeft===0)loan+='<div class="bad"><b>⚠ Срочно верните долг '+nm(r.lender)+': '+eur(r.due)+'.</b></div>';loan+=`<button class="sec" data-rep-loan="${r.loanId}">Вернуть ${nm(r.lender)}: ${eur(r.due)}</button>`})}
 const mine=(['auction','race_join'].includes(s.phase)||actor(s)===ME);
 const ctl=(s.phase==='loan'?'':(mine?controls():''))+loan;
 const turnLine=`<div class="turn">Ходит: ${pawn(cur.id,26)} ${cur.name}${s.phase==='move'&&actor(s)===ME?' — <span style="color:#2E7D46">выберите, на сколько шагов идти</span>':''}</div>${toast?`<div class="bad">${toast}</div>`:''}`;
 if(holding()&&ctl.includes('<button')){top=turnLine+'<p class="mut">Все смотрят, что выпало… Таймер стоит.</p>'}
 else if(s.phase!=='move'&&ctl.includes('<button')){ // после выбора клетки — действия крупно, на 80% экрана
  const card=(s.phase==='buy'&&s.pending)?bigCard(s.pending.cardId,'ОТКРЫТАЯ КАРТА'):(s.phase==='auction'&&s.auction)?bigCard(s.auction.cardId,'АУКЦИОН · СТАВКА '+eur(s.auction.bid)+' · '+nm(s.auction.bidder).toUpperCase()):'';
  if(modalOff!==curKey)modalHTML=`<div class="mback"></div><div class="modal"><div class="mh"><span>${CN[BOARD[s.players[s.current].pos]]||''} · ${actor(s)===ME?'ваш ход':cur.name}</span><button class="sec" id="mclose">Посмотреть поле</button></div>${toast?`<div class="bad">${toast}</div>`:''}${card}${ctl}</div>`;
  else modalHTML=`<button class="reopen" id="mopen">Открыть действия</button>`;
  top=turnLine+'<p class="mut">Действия открыты в большом окне.</p>';
 }else top=turnLine+`<div>${ctl||'<p class="mut">Ждём ход игрока '+cur.name+'…</p>'}</div>`}
const players=s.players.map(q=>{const debt=s.loans.filter(l=>l.borrower===q.id).map(l=>`<div class="r" style="color:#FF8A80">Долг ${nm(l.lender)}: ${eur(loanDue(s,l))}</div>`).join('');
 return `<div class="pl ${q.id===s.current?'cur':''} ${q.eliminated?'out':''}" tabindex="0">${pawn(q.id,40)}<span class="n">${q.finished?MEDAL[q.finished]+' ':''}${q.name}${q.id===ME?' (вы)':''}${q.insured?' 🛡':''}</span><span class="mut" style="font-size:12px">${q.cars.length} маш.</span><span class="m">${eur(q.cash)}</span><div class="pop"><div style="display:flex;justify-content:space-between;font-weight:600;font-size:15px"><span>${q.name}</span><span>${eur(q.cash)}</span></div>${q.cars.map(c=>{const k=s.catalog[c.id],d=DC[k.deck],di=defInfo(c);return `<div class="r"><span class="chip" style="background:${d[0]};color:${d[1]};min-width:70px;text-align:center">${DN[k.deck]}</span><span>${k.name} · ${eur(shownPrice(c))}</span><span style="color:${di?'#FF8A80':'#7FD49A'}">${di?di[0]:'целая'}</span></div>`}).join('')||'<div class="mut">нет машин</div>'}${debt}</div></div>`}).join('');
const bon=[me.pendingBuyer?'покупатель на следующую машину':'',me.saleBonusUntil>s.round?'+10% к продаже':'',me.repairBonusUntil>s.round?'−10% на ремонт':'',me.expo?'выставка ретро':'',me.insured?'страховка':''].filter(Boolean).join(' · ');
$('#app').innerHTML=`<div class="vp"><div id="stage">
<div class="hdr"><div><div class="ttl">RUST TO RICHES</div><div class="sub">от ржавого ведра до миллионера</div></div><div>${(s.places||[]).length&&s.phase!=='over'?`<span class="pill"><small>ПРИЗЫ</small><b>${s.places.map((id,i)=>MEDAL[i+1]+nm(id)).join(' ')}</b></span><span class="pill"><small>ДОИГРЫВАЕМ ЗА</small><b>${s.places.length+1}-е</b></span>`:''}<span class="pill"><small>ЦЕЛЬ</small><b>${eur(s.goal)}</b></span><span class="pill"><small>РАУНД</small><b>${s.round}</b></span><span class="pill"><small>ТАЙМЕР</small><b id="tm"></b></span></div></div>
<div class="board">${cells}<div class="center"><div class="act">${top}<div class="log">${logs.slice(0,5).map(l=>'<div>'+l+'</div>').join('')}</div></div><div class="gar"><div class="gh"><span>МОЙ ГАРАЖ</span><span>Деньги: <b>${eur(me.cash)}</b></span><span>Если продать всё сейчас: <b style="color:#2E7D46">${eur(minAll)}</b></span>${bon?`<span class="chip" style="background:#E3F1E6">${bon}</span>`:''}</div><div class="cols">${gar||'<div class="mut">Машин пока нет</div>'}</div>${overlay(s)}</div></div></div>
<div class="pls">${players}</div><div id="info"></div>${modalHTML}</div></div>`;
scale();
document.querySelectorAll('[data-cell]').forEach(e=>{const i=+e.dataset.cell;
 e.onmouseenter=()=>{infoK=i;showInfo(i)};e.onmouseleave=()=>{infoK=null;showInfo(null)};
 e.onclick=()=>{infoK=infoK===i?null:i;showInfo(infoK)};
 e.ondblclick=()=>showInfo(i)});
document.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>act(JSON.parse(e.dataset.a)));
document.querySelectorAll('[data-dice]').forEach(e=>e.onclick=()=>armDice(JSON.parse(e.dataset.dice)));
const q=(sel,f)=>{const e=document.querySelector(sel);if(e)e.onclick=f};
q('[data-auc]',()=>act({type:'auction_start',amount:+$('#amt').value}));
q('[data-bid]',()=>act({type:'bid',amount:+$('#amt').value}));
document.querySelectorAll('[data-st]').forEach(e=>e.onclick=()=>{rs+=+e.dataset.st;render()});
const tg=$('#tg');if(tg)tg.onchange=()=>{rt=+tg.value;render()};
const upd=()=>{let t=0;document.querySelectorAll('.rc:checked').forEach(e=>t+=+e.dataset.c);const c=G.players[ME].cash;if($('#rt2')){$('#rt2').textContent=eur(t);$('#rw').textContent=t>c?'не хватает '+eur(t-c):''}};
document.querySelectorAll('.rc').forEach(e=>e.onchange=upd);
q('[data-rep]',()=>act({type:'repair',carIds:[...document.querySelectorAll('.rc:checked')].map(e=>e.value)}));
q('[data-ch]',()=>act({type:'race_challenge',target:rt,stake:rs}));
q('[data-loan]',()=>act({type:'loan_request',amount:+$('#la').value}));
document.querySelectorAll('[data-rep-loan]').forEach(e=>e.onclick=()=>act({type:'repay_loan',loanId:+e.dataset.repLoan}));
document.querySelectorAll('.sc').forEach(e=>e.onchange=()=>{let x=0;document.querySelectorAll('.sc:checked').forEach(y=>x+=+y.dataset.v);$('#st').textContent=eur(x)});
q('[data-swp]',()=>act({type:'swap_propose',carId:$('#sw1').value,target:+$('#swt').value,theirCarId:$('#sw2').value}));
const swt=$('#swt');if(swt)swt.onchange=()=>{sw.t=+swt.value;render()};
q('[data-sell]',()=>act({type:'sell',carIds:[...document.querySelectorAll('.sc:checked')].map(e=>e.value)}));
q('#again',leave);q('#hist2',()=>{leave();$('#app').innerHTML=histHTML();$('#hb').onclick=()=>lobby()});
q('#mclose',()=>{modalOff=curKey;render()});q('#mopen',()=>{modalOff='';render()})}

setInterval(()=>{if(!G||G.phase==='over')return;const t=$('#tm');if(t)t.textContent=Math.max(0,Math.min(secs(curKey),Math.ceil((deadline-Date.now())/1000)))+' с'},250);
boot();
</script></body></html>
